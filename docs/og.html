<!doctype html>
<!-- 링크 미리보기 그림(og.png 1200x630) 원본. 크롬 headless 로 찍는다(build.js 주석 참고) -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Pretendard,sans-serif;background:#f5f6f8;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#222}
.card{width:1040px;height:470px;background:#fff;border:2px solid #e5e8eb;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{margin:0;font-size:132px;font-weight:800;letter-spacing:-5px;line-height:1}
h1 em{font-style:normal;color:#03c75a}
p{margin:36px 0 0;font-size:40px;color:#555;letter-spacing:-1px}
.box{margin-top:44px;width:640px;height:76px;border:4px solid #03c75a;border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 28px;box-sizing:border-box;font-size:30px;color:#8f939a}
.box b{width:76px;height:76px;margin-right:-4px;background:#03c75a;display:grid;place-items:center}
.u{position:absolute;bottom:28px;font-size:26px;color:#8f939a}
</style></head><body>
<div class="card">
<h1><em>AI</em> 용어사전</h1>
<p>일상 말부터 실무 용어, 더 나아가 전문 용어까지.</p>
<div class="box">AI 용어를 검색해 보세요<b><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg></b></div>
</div>
<div class="u">macultist.kr/aiterms</div>
</body></html>
